version: '3'
services:
  bot:
    build: .
    image: amedeiros/algo-bot-dev
    command: [ "hy", "./algo_bot/run.hy" ]
    env_file: bot-variables.env
    volumes:
      - .:/usr/src/app
    depends_on:
      - db
      - redis
  db:
    image: mysql:latest
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: algo-bot
    volumes:
      - .dbdata:/var/lib/mysql
    depends_on:
      - adminer
    ports:
      - 3306:3306
  adminer:
    image: adminer:latest
    restart: always
    ports:
      - 8080:8080
  redis:
    image: redis:latest
    ports:
      - 6379:6379
    volumes:
      - cache:/data
volumes:
  cache:
